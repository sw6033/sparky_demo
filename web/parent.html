<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6ee"><title>Sparky · 家长空间</title><link rel="stylesheet" href="/style.css"><script defer src="/parent.js"></script></head>
<body><main class="parentPage"><div class="sectionHeading"><h2>家长空间</h2><a href="/">返回小屋</a></div><p id="engine"></p><div id="profiles"></div><form id="newProfile"><input aria-label="新档案称呼" maxlength="32" placeholder="新档案称呼" required><button>新建档案</button></form><h3>交流与教学方式</h3><p>英语母语，中文目标语言。由家长设置，不根据一次回答定级。</p><form id="learnerForm"><label>英语表达 <select id="nativeLevel"><option value="unknown">暂不确定</option><option value="early">尚在发展：简单中文与情境示范</option><option value="confident">较熟练：可加简短英文解释</option></select></label><button>保存</button></form><h3>对话记忆摘要</h3><p>自动摘要可能出错，可以清除；重要偏好请在下方明确记录。</p><pre id="summaryView"></pre><button id="forgetContext" type="button">清除对话摘要</button><h3>学习观察</h3><div id="observations"></div><h3>已确认的偏好</h3><div id="memories"></div><form id="memoryForm"><input aria-label="已确认的偏好" maxlength="80" placeholder="例如：喜欢恐龙" required><button>记住</button></form><hr><button id="deleteProfile" class="danger">删除当前档案</button><p id="parentStatus" role="status"></p></main></body></html>
