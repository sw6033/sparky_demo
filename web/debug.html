<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky 开发调试</title><link rel="stylesheet" href="/style.css"><script defer src="/debug.js"></script>
<style>main{max-width:1100px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #ccc}select,input,button{font:inherit;padding:8px}summary{cursor:pointer;margin:16px 0}</style></head>
<body><header><div class="brand">Sparky <small>开发调试</small></div><a href="/">回到小屋</a></header><main>
<p>同一轮的识别、决策、合成和播放共用一个编号。耗时单位为毫秒；客户端耗时以浏览器上报为准。</p>
<label>档案 <select id="profiles"></select></label> <label>家长 PIN <input id="pin" type="password" autocomplete="off"></label> <button id="refresh">刷新</button>
<p id="status" role="status"></p><div id="turns"></div><details><summary>会话摘要与近期事件</summary><pre id="summary"></pre></details><details><summary>第二层大脑实际 System Prompt</summary><pre id="prompt"></pre></details>
</main></body></html>
